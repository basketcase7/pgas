# Веб-кабинет заявителя: статика SPA + обратный прокси к api-gateway и объектному хранилищу.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Встроенные скрипты запрещены (только файлы со своего origin) — снижает последствия XSS.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    # ЛР5 (ZAP 10063, 90004): запрет API устройств и изоляция окна/ресурсов от чужих сайтов
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cross-Origin-Resource-Policy same-origin always;

    # API: TLS до шлюза с проверкой его сертификата (B-01)
    location /api/ {
        proxy_pass https://api-gateway:8443;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/certs/gateway.crt;
        proxy_ssl_name api-gateway;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        client_max_body_size 1m;
    }

    # Вложения (B-03): файл идёт браузер → хранилище по presigned-ссылке, минуя API-сервисы.
    # Прокси нужен только для same-origin (хранилище не отдаёт CORS); подпись проверяет хранилище.
    location /applications-attachments/ {
        proxy_pass http://object-storage:8333;
        proxy_set_header Host object-storage:8333;
        proxy_request_buffering off;
        client_max_body_size 11m;
        # Загруженный файл не исполняется как страница сайта: хранилище отдаёт его с
        # Content-Disposition: attachment (заголовок хранилища заменяется), типы — только PDF/JPEG/PNG
        # (политика загрузки), nosniff запрещает браузеру угадывать тип, CSP запрещает любые ресурсы.
        # Директиву CSP sandbox не используем: Chromium блокирует скачивание из «песочницы».
        # ЛР5, V-S01 (Semgrep header-redefinition): add_header в location ОТМЕНЯЕТ все add_header
        # server-блока, поэтому заголовки безопасности повторены здесь полностью. Presigned-ссылка
        # (подпись в query) не должна уходить в Referer, а документ с ПДн — оседать в кэше браузера.
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        proxy_hide_header Content-Disposition;
        add_header Content-Disposition attachment always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
