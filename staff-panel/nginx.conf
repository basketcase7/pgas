# Панель сотрудника: статика SPA + обратный прокси к api-gateway и объектному хранилищу.
#
# ЛР5, V-S01: все заголовки ответа задаются ТОЛЬКО на уровне server. В nginx любой add_header
# внутри location отменяет все add_header server-блока (Semgrep header-redefinition) — так ответ
# хранилища вложений терял Referrer-Policy и X-Frame-Options. Значения, которые для вложений
# другие, выбираются картами по пути запроса; пустое значение — заголовок не добавляется.
map $uri $sec_csp {
    ~^/applications-attachments/  "default-src 'none'; frame-ancestors 'none'";
    # Встроенные скрипты запрещены (только файлы со своего origin) — снижает последствия XSS.
    default                       "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'";
}
# Файл из хранилища отдаётся только как вложение (не исполняется как страница сайта)
map $uri $sec_disposition {
    ~^/applications-attachments/  attachment;
    default                       "";
}
# Документ с ПДн не оседает в кэше браузера
map $uri $sec_cache {
    ~^/applications-attachments/  no-store;
    default                       "";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header Content-Security-Policy $sec_csp always;
    add_header Content-Disposition $sec_disposition always;
    add_header Cache-Control $sec_cache always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    # ЛР5 (ZAP 10063, 90004): запрет API устройств и изоляция окна/ресурсов от чужих сайтов
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cross-Origin-Resource-Policy same-origin always;

    # API: TLS до шлюза с проверкой его сертификата (B-01)
    location /api/ {
        proxy_pass https://api-gateway:8443;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/certs/gateway.crt;
        proxy_ssl_name api-gateway;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        client_max_body_size 1m;
    }

    # Вложения (B-03): файл идёт браузер → хранилище по presigned-ссылке, минуя API-сервисы.
    # Прокси нужен только для same-origin (хранилище не отдаёт CORS); подпись проверяет хранилище.
    # Типы — только PDF/JPEG/PNG (политика загрузки), nosniff запрещает угадывать тип, CSP —
    # любые ресурсы. Директиву CSP sandbox не используем: Chromium блокирует скачивание из «песочницы».
    location /applications-attachments/ {
        proxy_pass http://object-storage:8333;
        proxy_set_header Host object-storage:8333;
        proxy_request_buffering off;
        client_max_body_size 1m; # из панели файлы только скачиваются
        # заголовки хранилища заменяются заголовками server-блока
        proxy_hide_header Content-Disposition;
        proxy_hide_header Cache-Control;
    }

    location / {
        try_files $uri /index.html;
    }
}
